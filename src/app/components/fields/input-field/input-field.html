<div class="field-container">
    @if (label()) {
        <label class="label-field">{{ label() }}</label>
    }
    <input
        [type]="type()"
        class="input-field"
        [placeholder]="placeholder()"
        [value]="value()"
        [readonly]="readonly()"
        (input)="handleInput($event)"
    />
</div>
