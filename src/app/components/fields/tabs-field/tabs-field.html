<div class="field-container">
    @if (label()) {
        <label class="label-field">{{ label() }}</label>
    }

    <div
        class="tabs-field"
        [class.tabs-field--full]="fullWidth()"
        [class.tabs-field--small]="small()"
        role="tablist"
    >
        <span class="tabs-field-thumb" [style]="thumbStyle()"></span>

        @for (option of options(); track option.value) {
            <button
                type="button"
                class="tabs-field-item"
                role="tab"
                [class.is-active]="option.value === value()"
                [class.is-disabled]="option.disabled"
                [attr.aria-selected]="option.value === value()"
                [disabled]="option.disabled"
                (click)="select(option)"
            >
                @if (option.icon) {
                    <app-icon [name]="option.icon" class="tabs-field-icon" />
                }
                <span class="tabs-field-label">{{ option.label }}</span>
            </button>
        }
    </div>
</div>
