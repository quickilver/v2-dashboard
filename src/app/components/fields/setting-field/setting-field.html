<div class="setting-field">
    @switch (type()) {
        @case ('text') {
            <app-input-field
                [label]="title()"
                [value]="textValue()"
                (valueChange)="value.set($event)"
            />
        }
        @case ('checkbox') {
            <app-checkbox-field
                [label]="''"
                [checked]="!!value()"
                (checkedChange)="value.set($event)"
            />
        }
        @case ('select') {
            <app-select-field
                [label]="title()"
                [options]="selectOptions()"
                [value]="selectValue()"
                (valueChange)="value.set($event ?? '')"
            />
        }
    }
</div>
