@if (loading()) {
    <div class="editor-loading">Загрузка...</div>
} @else {
    <div class="editor-form">
        <div class="editor-body">
            <app-input-field
                label="GUID"
                placeholder="Введите GUID цены"
                [(value)]="guid"
            />

            <app-input-field
                label="Название"
                placeholder="Введите название цены"
                [(value)]="title"
            />

            <app-input-field
                label="Валюта"
                placeholder="Введите валюту"
                [(value)]="currency"
            />
        </div>


    </div>
    <div class="editor-actions">
        <button (click)="onCancel()">Отмена</button>
        <button class="primary" (click)="onSave()" [disabled]="saving()">
            {{ saving() ? 'Сохранение...' : (isEditMode() ? 'Сохранить' : 'Создать') }}
        </button>
    </div>
}
