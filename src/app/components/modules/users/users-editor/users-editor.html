<div class="editor-container">
    @if (loading()) {
        <div class="editor-loading">Загрузка...</div>
    } @else {
        <div class="tabs top-line">
            <div [class.is-active]="isActiveTab('info')" (click)="changeTab('info')">
                Информация
            </div>
            <div [class.is-active]="isActiveTab('modules')" (click)="changeTab('modules')">
                Модули
            </div>
        </div>

        <div class="editor-form">
            @if (isActiveTab('info')) {
                <div class="editor-body">
                    <app-input-field
                        label="Имя"
                        placeholder="Введите имя пользователя"
                        [(value)]="name"
                    />

                    <app-input-field
                        label="Email"
                        placeholder="Введите email"
                        [(value)]="email"
                    />

                    <app-checkbox-field label="Полный доступ" [(checked)]="fullAccess" />
                </div>
            }

            @if (isActiveTab('modules')) {
                <div class="editor-body modules-list">
                    @for (item of flatModules(); track item.module.id) {
                        <label class="checkbox-label parent">
                            <input
                                type="checkbox"
                                [checked]="permissions().includes(item.module.id)"
                                (change)="toggleModule(item.module.id)"
                            />
                            {{ item.module.title }}
                        </label>

                        @for (child of item.children; track child.id) {
                            <label class="checkbox-label child">
                                <input
                                    type="checkbox"
                                    [checked]="permissions().includes(child.id)"
                                    (change)="toggleModule(child.id)"
                                />
                                {{ child.title }}
                            </label>
                        }
                    }
                </div>
            }
        </div>

        <div class="editor-actions">
            <button (click)="onCancel()">Отмена</button>
            <button class="primary" (click)="onSave()" [disabled]="saving()">
                {{ saving() ? 'Сохранение...' : isEditMode() ? 'Сохранить' : 'Создать' }}
            </button>
        </div>
    }
</div>
