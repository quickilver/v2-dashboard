@if (loading()) {
    <div class="editor-loading">Загрузка...</div>
} @else {
    <div class="editor-form">
        <div class="editor-body">
            <app-input-field
                label="Название"
                placeholder="Введите название настройки"
                [(value)]="title"
            />

            <app-input-field
                label="Алиас"
                placeholder="Введите алиас настройки"
                [(value)]="alias"
            />

            <app-input-field
                label="Тип"
                placeholder="text, number, boolean, image, wyswig"
                [(value)]="type"
            />

            <app-input-field
                label="Группа"
                placeholder="Введите группу настройки"
                [(value)]="group"
            />

            <app-input-field
                label="Значение"
                placeholder="Введите значение настройки"
                [(value)]="value"
            />
        </div>
    </div>

    <div class="editor-actions">
        <button (click)="onCancel()">Отмена</button>
        <button class="primary" (click)="onSave()" [disabled]="saving()">
            {{ saving() ? 'Сохранение...' : (isEditMode() ? 'Сохранить' : 'Создать') }}
        </button>
    </div>
}
