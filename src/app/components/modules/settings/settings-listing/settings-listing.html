<div class="settings-list">
    @for (group of groupedSettings(); track group[0]) {
        <div class="settings-group">
            @if (group[0]) {
                <h3 class="settings-group-title">{{ group[0] }}</h3>
            }
            <div class="settings-group-body">
                @for (setting of group[1]; track setting.id) {
                    <div class="settings-list-item">
                        <app-setting-field
                            class="setting-field"
                            [title]="setting.title"
                            [type]="setting.type === 'checkbox' ? 'checkbox' : 'text'"
                            [value]="setting.type === 'checkbox' ? (setting.value === '1' || setting.value === 'true') : setting.value ?? ''"
                            [alias]="setting.alias"
                            [options]="setting.options"
                        />
                    </div>
                }
            </div>
        </div>
    }
</div>

@if (settings().length === 0) {
    <div class="settings-empty">Нет настроек</div>
}
