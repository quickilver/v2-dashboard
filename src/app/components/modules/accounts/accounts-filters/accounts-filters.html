<div class="filters-title">Фильтры</div>
<div class="accounts-filters">
    <div class="filters-group filters-search">
        <app-input-field
            placeholder="Поиск по имени, email или телефону"
            [value]="filters().query"
            (valueChange)="onQueryChange($event)"
        />
    </div>

    <div class="filters-group">
        <div class="filters-group-title" (click)="toggleGroup('status')">
            <span>
                Статус
                @if (blockedCount()) {
                    <span class="filters-count">{{ blockedCount() }}</span>
                }
            </span>
            <span class="filters-group-arrow" [class.is-open]="isExpanded('status')">
                <app-icon name="chevron-down" [size]="16" />
            </span>
        </div>

        @if (isExpanded('status')) {
            <div class="filters-group-content filters-status">
                <label class="filters-option">
                    <input
                        type="radio"
                        name="account-status"
                        [checked]="filters().is_blocked === null"
                        (change)="onBlockedChange(null)"
                    />
                    <span>Все</span>
                </label>
                <label class="filters-option">
                    <input
                        type="radio"
                        name="account-status"
                        [checked]="filters().is_blocked === false"
                        (change)="onBlockedChange(false)"
                    />
                    <span>Активные</span>
                </label>
                <label class="filters-option">
                    <input
                        type="radio"
                        name="account-status"
                        [checked]="filters().is_blocked === true"
                        (change)="onBlockedChange(true)"
                    />
                    <span>Заблокированные</span>
                </label>
            </div>
        }
    </div>
</div>
