<app-listing
    [columns]="columns()"
    [availableColumns]="columns()"
    [columnsStorageKey]="columnsStorageKey"
    [data]="accounts()"
    [loading]="loading()"
    [meta]="meta()"
    [pageSize]="pageSize()"
    [page]="page()"
    title="Клиенты"
    [actionsColumn]="true"
    [duplicable]="true"
    [sizable]="true"
    searchPlaceholder="Поиск по имени, email или телефону"
    (rowClick)="onRowClick($event)"
    (searchChange)="onSearch($event.toString())"
    (sortChange)="onSort($event)"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
    (editClick)="onEdit($event)"
    (deleteClick)="onDelete($event)"
    (createClick)="createClick()"
    (duplicateClick)="createClick($event.id)"
>
    <app-select-field
        filter-actions
        placeholder="Все статусы"
        [options]="blockedOptions"
        [value]="blocked()"
        (valueChange)="onBlockedChange($event)"
    />
</app-listing>
