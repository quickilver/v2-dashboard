<div class="editor-container">
    @if (loading()) {
        <div class="editor-loading">
            <app-skeleton [count]="5" width="100%" [height]="36" [gap]="12" />
        </div>
    } @else {
        <div class="tabs">
            <div [class.is-active]="isActiveTab('info')" (click)="changeTab('info')">
                Информация
            </div>
            @if (isEditMode()) {
                <div [class.is-active]="isActiveTab('orders')" (click)="changeTab('orders')">
                    Заказы <span class="tag">{{ ordersCount() }}</span>
                </div>
            }
        </div>

        <div class="editor-form">
            @if (isActiveTab('info')) {
                <div class="editor-body">
                    @if (isEditMode()) {
                        <app-input-field label="ID" [value]="id() ?? ''" [readonly]="true" />
                    }

                    <app-input-field
                        label="Фамилия"
                        placeholder="Введите фамилию"
                        [(value)]="lastName"
                    />

                    <app-input-field
                        label="Имя"
                        placeholder="Введите имя"
                        [(value)]="firstName"
                    />

                    <app-input-field
                        label="Отчество"
                        placeholder="Введите отчество"
                        [(value)]="middleName"
                    />

                    <app-input-field
                        label="Телефон"
                        placeholder="+7 (___) ___-__-__"
                        mask="+7 (999) 999-99-99"
                        [(value)]="phone"
                    />

                    <app-input-field
                        label="Email"
                        placeholder="Введите email"
                        [(value)]="email"
                    />

                    <app-input-field
                        label="Пароль"
                        type="password"
                        [placeholder]="
                            isEditMode()
                                ? 'Оставьте пустым, чтобы не менять'
                                : 'Введите пароль'
                        "
                        [(value)]="password"
                    />

                    <app-checkbox-field label="Заблокирован" [(checked)]="isBlocked" />
                </div>
            }

            @if (isActiveTab('orders')) {
                <div class="editor-body">
                    @if (ordersCount() > 0) {
                        <div class="orders-list">
                            <!-- Список заказов появится после реализации модуля заказов -->
                        </div>
                    } @else {
                        <div class="orders-empty">Заказов пока нет</div>
                    }
                </div>
            }
        </div>

        <div class="editor-actions">
            <button (click)="onCancel()">Отмена</button>
            <button class="primary" (click)="onSave()" [disabled]="saving()">
                {{ saving() ? 'Сохранение...' : isEditMode() ? 'Сохранить' : 'Создать' }}
            </button>
        </div>
    }
</div>
