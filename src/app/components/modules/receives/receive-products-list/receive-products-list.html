@if (products().length === 0) {
    <div class="products-empty">Товары не добавлены</div>
} @else {
    <table class="table">
        <thead>
            <tr>
                <th class="col-id">ID</th>
                <th>Название</th>
                <th class="col-purchase">Закуп</th>
                <th class="col-count">Кол-во</th>
                <th>Сумма</th>
                <th>Цена</th>
                <th class="col-actions">Действия</th>
            </tr>
        </thead>
        <tbody>
            @for (product of products(); track product.id) {
                <tr>
                    <td class="col-id">{{ product.id }}</td>
                    <td class="col-title">
                        <div>{{ product.title }}</div>
                        <div class="is-sku">{{ product.sku }}</div>
                    </td>
                    <td class="col-purchase">
                        <app-input-field
                            size="small"
                            type="number"
                            placeholder="0"
                            [value]="getPurchase(product.id)"
                            (valueChange)="onPurchaseChange(product.id, $event)"
                        />
                    </td>
                    <td class="col-count">
                        <app-counter-field
                            size="small"
                            [min]="1"
                            [value]="getCount(product.id)"
                            (valueChange)="onCountChange(product.id, $event)"
                        />
                    </td>
                    <td class="col-total">
                        {{ formatTotal(product.id) }}
                    </td>
                    <td class="col-new-price">
                        <app-input-field
                            size="small"
                            type="number"
                            placeholder="0"
                            [value]="getNewPrice(product.id)"
                            (valueChange)="onNewPriceChange(product.id, $event)"
                        />
                    </td>
                    <td class="actions-td">
                        <button type="button" class="remove-button" (click)="onRemove(product)">
                            Удалить
                        </button>
                    </td>
                </tr>
            }
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3" class="footer-label">Итого</td>
                <td class="col-count footer-count">{{ totalCount() }}</td>
                <td class="col-total footer-total">{{ formattedTotalPrice() }}</td>
                <td></td>
                <td></td>
            </tr>
        </tfoot>
    </table>
}
