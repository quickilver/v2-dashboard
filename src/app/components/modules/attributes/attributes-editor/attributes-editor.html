<div class="editor-container">
    @if (loading()) {
        <div class="editor-loading">Загрузка...</div>
    } @else {
        <div class="tabs top-line">
            <div [class.is-active]="isActiveTab('info')" (click)="changeTab('info')">
                Информация
            </div>
            @if (isEditMode()) {
                <div [class.is-active]="isActiveTab('values')" (click)="changeTab('values')">
                    Значения<span class="tag">{{ values().length }}</span>
                </div>
            }
        </div>

        <div class="editor-form">
            @if (isActiveTab('info')) {
                <div class="editor-body">
                    <app-input-field
                        label="GUID"
                        placeholder="Введите GUID характеристики"
                        [(value)]="guid"
                    />

                    <app-input-field
                        label="Название"
                        placeholder="Введите название характеристики"
                        [(value)]="title"
                    />

                    <app-checkbox-field
                        label="Отображать на сайте"
                        [(checked)]="isDisplay"
                    />

                    <app-checkbox-field
                        label="Использовать как фильтр"
                        [(checked)]="isFilter"
                    />
                </div>
            }

            @if (isActiveTab('values')) {
                <app-attribute-values-tab [(values)]="values" />
            }
        </div>

        <div class="editor-actions">
            <button (click)="onCancel()">Отмена</button>
            <button class="primary" (click)="onSave()" [disabled]="saving()">
                {{ saving() ? 'Сохранение...' : (isEditMode() ? 'Сохранить' : 'Создать') }}
            </button>
        </div>
    }
</div>
