@if (restoring()) {
    <div class="backup-restore-bar">
        Восстановление базы из <strong>{{ restoring() }}</strong
        >...
    </div>
}
<ng-template #rowActions let-row>
    <button
        type="button"
        class="restore-button"
        [disabled]="backupActionPending()"
        (click)="onRestore(row)"
    >
        Восстановить
    </button>
</ng-template>
<app-listing
    [columns]="columns()"
    [availableColumns]="columns()"
    [columnsStorageKey]="columnsStorageKey"
    [data]="pagedRows()"
    [loading]="loading()"
    [meta]="meta()"
    [pageSize]="pageSize()"
    [page]="page()"
    title="Резервные копии базы данных"
    searchPlaceholder="Имя файла"
    (searchChange)="onSearch($event.toString())"
    [actionsColumn]="true"
    [rowActionsTemplate]="rowActions"
    [sizable]="true"
    (createClick)="onCreateBackup()"
    (cellClick)="onCellClick($event)"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
>
    <ng-container header-actions>
        @if (canUpload()) {
            <input
                #dumpFile
                type="file"
                accept=".sql,.gz,application/gzip,application/x-gzip"
                hidden
                (change)="onUpload(dumpFile)"
            />
            <button type="button" [disabled]="backupActionPending()" (click)="dumpFile.click()">
                Загрузить
            </button>
        }
    </ng-container>
</app-listing>
