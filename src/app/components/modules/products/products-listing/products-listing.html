<app-listing
    [columns]="columns()"
    [data]="products()"
    [loading]="loading()"
    [meta]="meta()"
    [pageSize]="pageSize()"
    [page]="page()"
    title="Товары"
    [actionsColumn]="true"
    (rowClick)="onRowClick($event)"
    (searchChange)="onSearch($event.toString())"
    (sortChange)="onSort($event)"
    (pageChange)="onPageChange($event)"
    (editClick)="onEdit($event)"
    (deleteClick)="onDelete($event)"
/>
