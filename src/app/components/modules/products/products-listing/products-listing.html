<div class="products-listing-container">
    <app-products-filters [filters]="filters()" (filtersChange)="onFiltersChange($event)" />
    <app-listing
        [columns]="columns()"
        [data]="products()"
        [loading]="loading()"
        [meta]="meta()"
        [pageSize]="pageSize()"
        [page]="page()"
        title="Товары"
        [actionsColumn]="true"
        [searchable]="false"
        (rowClick)="onRowClick($event)"
        (sortChange)="onSort($event)"
        (pageChange)="onPageChange($event)"
        (editClick)="onEdit($event)"
        (deleteClick)="onDelete($event)"
        (createClick)="createClick()"
    />
</div>
