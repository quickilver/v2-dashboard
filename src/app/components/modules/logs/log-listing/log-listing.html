<app-listing
    [columns]="columns()"
    [availableColumns]="columns()"
    [columnsStorageKey]="columnsStorageKey"
    [data]="rows()"
    [loading]="loading()"
    [meta]="meta()"
    [pageSize]="pageSize()"
    [page]="page()"
    title="Логи"
    [actionsColumn]="false"
    [sizable]="true"
    searchPlaceholder="Сущность"
    (searchChange)="onSearch($event.toString())"
    (rowClick)="onRowClick($event)"
    (cellClick)="onCellClick($event)"
    (sortChange)="onSort($event)"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
>
    <div filter-actions class="log-filters">
        <app-select-field
            placeholder="Все события"
            [options]="eventOptions"
            [value]="event()"
            (valueChange)="onEventChange($event)"
        />
        <app-autocomplete-users-field
            placeholder="Пользователь"
            [value]="user()"
            (valueChange)="onUserChange($event)"
        />
    </div>
</app-listing>
