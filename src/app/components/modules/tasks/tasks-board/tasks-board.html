<div class="header">
    <div class="title">Задачи</div>
    <div class="actions"></div>
</div>

@if (loading()) {
    <div class="board-loading">
        <app-skeleton [count]="3" width="480px" [height]="120" [gap]="20" [dark]="true" />
    </div>
} @else {
    <div class="board">
        @for (group of groups(); track group.id) {
            <div
                class="board-column"
                [class.is-drag-over]="dropTarget()?.groupId === group.id"
                (dragover)="onDragOver(group, $event)"
                (dragleave)="onDragLeave(group, $event)"
                (drop)="onDrop(group, $event)"
            >
                <div class="board-column-header">
                    <div class="board-column-title">{{ group.title }}</div>
                    <div class="board-column-actions">
                        <button
                            class="icon-button create-task"
                            title="Создать задачу"
                            (click)="createTask(group)"
                        >
                            +
                        </button>
                    </div>
                </div>

                <div
                    class="board-column-body"
                    [class.drop-at-end]="
                        dropTarget()?.groupId === group.id && dropTarget()?.beforeTaskId === null
                    "
                >
                    @for (task of tasksOf(group); track task.id) {
                        <app-task-card
                            [task]="task"
                            [attr.draggable]="!moving()"
                            [attr.data-task-id]="task.id"
                            [class.drop-before]="dropTarget()?.beforeTaskId === task.id"
                            [class.is-dragging]="draggedTask()?.id === task.id"
                            (dragstart)="onDragStart(task, $event)"
                            (dragend)="onDragEnd()"
                            (opened)="openTask($event)"
                        />
                    } @empty {
                        <div class="board-column-empty">Нет задач</div>
                    }
                </div>
            </div>
        }

        <button class="board-add-column" (click)="createGroup()">
            <span>Добавить колонку</span>
        </button>
    </div>

    @if (groups().length === 0) {
        <div class="board-empty">Колонок пока нет — добавьте первую колонку</div>
    }
}
