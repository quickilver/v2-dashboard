<div class="header">
    <div class="title">Задачи</div>
    <div class="actions">
        <button class="primary" (click)="createGroup()">
            <app-icon name="plus" [size]="18" />
            <span>Добавить колонку</span>
        </button>
    </div>
</div>

@if (loading()) {
    <div class="board-loading">
        <app-skeleton [count]="3" width="280px" [height]="120" [gap]="20" />
    </div>
} @else {
    <div class="board">
        @for (group of groups(); track group.id) {
            <div class="board-column">
                <div class="board-column-header">
                    <div class="board-column-title">{{ group.title }}</div>
                    <div class="board-column-actions">
                        <button
                            class="icon-button create-task"
                            title="Создать задачу"
                            (click)="createTask(group)"
                        >
                            +
                        </button>
                    </div>
                </div>

                <div class="board-column-body">
                    @for (task of tasksOf(group); track task.id) {
                        <app-task-card [task]="task" (opened)="editTask($event)" />
                    } @empty {
                        <div class="board-column-empty">Нет задач</div>
                    }
                </div>
            </div>
        }

        <button class="board-add-column" (click)="createGroup()">
            <span>Добавить колонку</span>
        </button>
    </div>

    @if (groups().length === 0) {
        <div class="board-empty">Колонок пока нет — добавьте первую колонку</div>
    }
}
