<div class="board-task" (click)="onOpen()">
    <div class="board-task-text">
        <div class="board-task-title">{{ task().title }}</div>
    </div>
    <div class="board-task-info">
        <div class="board-task-icon">
            <app-icon name="user" [size]="18"/>
        </div>
        <div class="board-task-meta">
            @if (task().assignee; as assignee) {
                <div class="board-task-assignee">
                    <strong>{{ assignee.name }}</strong>
                </div>
            } @else {
                <div class="board-task-assignee no-assignee">Нет исполнителя</div>
            }
        </div>
    </div>
</div>
