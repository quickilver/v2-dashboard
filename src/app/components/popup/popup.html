@if (popupService.stack().length) {
    <div class="popup-overlay">
        @for (entry of popupService.stack(); track entry.id; let i = $index) {
            <div
                class="popup-dialog"
                [class]="entry.dialogClass"
                [class.is-behind]="i > 0"
                [style.z-index]="popupService.stack().length - i"
            >
                <div class="popup-header">
                    <div class="popup-title">{{ entry.title }}</div>
                    @if (i === 0) {
                        <button class="popup-close" (click)="popupService.resolve()">✕</button>
                    }
                </div>
                <div class="popup-body">
                    <ng-container *ngComponentOutlet="entry.component; inputs: getInputs(entry)" />
                </div>
            </div>
        }
    </div>
}
