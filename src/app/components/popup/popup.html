@for (entry of popupService.stack(); track entry.id) {
    <div class="popup-overlay" [style.z-index]="1000 + (popupService.stack().length - 1 - $index)">
        <div class="popup-dialog" [class]="entry.dialogClass">
            <div class="popup-header">
                <div class="popup-title">{{ entry.title }}</div>
                @if ($first) {
                    <button class="popup-close" (click)="popupService.resolve()">✕</button>
                }
            </div>
            <div class="popup-body">
                <ng-container *ngComponentOutlet="entry.component; inputs: getInputs(entry)" />
            </div>
        </div>
    </div>
}
